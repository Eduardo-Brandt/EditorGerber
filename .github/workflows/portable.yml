name: Portable Windows Linux macOS

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: windows-x64
          - runner: ubuntu-22.04
            platform: linux-x64
          - runner: macos-15-intel
            platform: macos-x64
          - runner: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxkbcommon-x11-0 libegl1 libgl1 libopengl0 libxrender1 libxcursor1 libxrandr2 libxi6 libxinerama1 fonts-dejavu-core
      - name: Install release dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Validate tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: python
        run: |
          import os, sys
          sys.path.insert(0, os.environ['GITHUB_WORKSPACE'])
          from gerber_editor.app.metadata import VERSION
          assert os.environ['GITHUB_REF_NAME'] == 'v'+VERSION
      - name: Build and verify Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m scripts.build_portable
      - name: Build and verify Windows or macOS
        if: runner.os != 'Linux'
        run: python -m scripts.build_portable
      - uses: actions/upload-artifact@v7
        with:
          name: portable-${{ matrix.platform }}
          path: |
            dist/*-${{ matrix.platform }}.*
          if-no-files-found: error
          compression-level: 0
      - name: Corresponding source
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: portable-source
          path: dist/*-source.zip*
          if-no-files-found: error
      - name: Diagnostic report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-${{ matrix.platform }}
          path: |
            build/**/verification/report.json
            build/**/work/**/warn-*.txt

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: portable-*
          path: release-assets
          merge-multiple: true
      - name: Publish download files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release-assets
          sed -i 's/\r$//' *.sha256
          sha256sum -c *.sha256
          cd ..
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true || { echo "Release ja publicada; preservando arquivos existentes."; exit 1; }
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Editor Gerber $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
