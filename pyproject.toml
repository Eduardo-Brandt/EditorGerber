[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gerber-editor"
version = "0.14.0"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{name = "Eduardo Guilherme Brandt"}]
description = "Editor Gerber 2D com preservação da origem"
requires-python = ">=3.11"
dependencies = ["PySide6-Essentials>=6.8.1,<7", "shapely>=2.1,<3", "numpy>=1.24,<3", "qrcode>=8,<9"]

[project.optional-dependencies]
step = ["cadquery-ocp==7.9.3.1"]

[project.gui-scripts]
gerber-editor = "gerber_editor.main:main"

[tool.setuptools.packages.find]
include = ["gerber_editor*"]

[tool.setuptools.package-data]
gerber_editor = ["assets/*.png", "assets/*.ico", "assets/*.md", "assets/*.html", "locales/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["output", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
